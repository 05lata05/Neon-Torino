<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Torino</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f17;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #gl,#hud{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
  #gl{outline:none;touch-action:none}
  #hud{pointer-events:none}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd1f0;font-size:20px;font-weight:700;letter-spacing:.04em;background:#120a24;text-align:center;padding:20px}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<canvas id="hud"></canvas>
<div id="load"></div>
<script>
  // loading text in the player's language (same rule as src/i18n: saved choice, otherwise the browser language)
  (() => {
    let l = null;
    try { l = localStorage.getItem('neontorino_lang'); } catch (e) {}
    const it = (l || navigator.language || 'it').slice(0, 2) === 'it';
    document.documentElement.lang = it ? 'it' : 'en';
    const el = document.getElementById('load');
    el.textContent = it ? 'Costruisco Santa Rita…' : 'Building Santa Rita…';
    setTimeout(() => {
      const e = document.getElementById('load');
      if (e) e.textContent = it ? 'Il motore 3D non si è caricato. Ricarica la pagina.' : 'The 3D engine did not load. Reload the page.';
    }, 20000);
  })();
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
