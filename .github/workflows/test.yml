# Automatic test: on every push and pull request runs `npm test` (tests/smoke.mjs)
# in headless Chromium with Playwright. The pictures in tests/out/ stay downloadable as an artifact.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies (local three, Prettier)
        run: npm ci

      # Playwright is not in devDependencies (locally the one already installed is used):
      # here it is added without touching package.json, with its Chromium.
      - name: Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Formatting (Prettier)
        run: npx prettier --check "src/**/*.js" "tests/**/*.mjs" "tools/**/*.mjs"

      - name: Simulated play and landmark pictures
        run: npm test

      - name: Pictures from tests/out/
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-pictures
          path: tests/out/
          if-no-files-found: ignore
          retention-days: 14
